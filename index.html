<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#073968">
  <meta name="description" content="CallFlow — a guided call-documentation learning experience.">
  <title>CallFlow — Learn the flow. Build the habit.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f9f8f4;--ink:#263a2d;--muted:#7e8b80;--sage:#698671;--sage-dark:#3b5946;--soft:#edf2ea;--white:#fffefa;--line:#e0e7dd;--alert:#956f51;--shadow:0 18px 50px rgba(47,69,51,.045); }
    * {box-sizing:border-box}
    html {scroll-behavior:smooth}
    body {margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}
    button,input,textarea {font:inherit}
    button {cursor:pointer}
    button:focus-visible,input:focus-visible,textarea:focus-visible {outline:3px solid #a6c1aa;outline-offset:3px}
    button:disabled {opacity:.4;cursor:not-allowed}
    ::selection {background:#cfded0}
    .shell {min-height:100vh;max-width:1650px;margin:0 auto;display:grid;grid-template-columns:218px minmax(0,1fr) 288px}
    .left {border-right:1px solid var(--line);display:flex;flex-direction:column;padding:33px 22px 24px;gap:70px}
    .brand {display:flex;align-items:center;gap:10px;font-size:23px;letter-spacing:-1.25px;font-weight:700;white-space:nowrap}
    .mark {display:grid;place-items:center;width:33px;height:33px;border:1.5px solid var(--sage);border-radius:50%;font-family:Georgia,serif;font-size:21px;color:var(--sage);font-weight:400}
    .brandDot {color:#a8b6a8}
    .sideSteps {display:grid;gap:7px}
    .sideStep {border:0;background:transparent;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 9px;border-radius:9px;color:#99a69a;font-size:12px;font-weight:500}
    .sideStep .num {width:27px;height:27px;flex:none;border:1px solid #d6e0d4;border-radius:50%;display:grid;place-items:center;font-size:10px}
    .sideStep.active {color:var(--ink);background:var(--soft);font-weight:700}
    .sideStep.active .num {background:var(--sage);border-color:var(--sage);color:white}
    .sideStep.done {color:var(--sage-dark)}
    .sideStep.done .num {border-color:#bcd1be}
    .sideFooter {margin-top:auto;border-top:1px solid var(--line);padding-top:20px;font-size:11px;line-height:1.8;color:#9da99e}
    .main {padding:31px clamp(28px,5.3vw,92px) 24px;min-width:0;display:flex;flex-direction:column;min-height:100vh}
    .top {display:flex;justify-content:space-between;align-items:center;gap:15px}
    .topBadge {border:1px solid #dfe8dc;background:#ffffff77;color:#6b856e;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:10px 13px;border-radius:50px;display:flex;gap:8px;align-items:center}
    .greenDot {width:6px;height:6px;background:#82aa87;border-radius:50%}
    .topTag {font-size:10px;color:#9bab9d;letter-spacing:1.1px;text-transform:uppercase}
    .progressTop {display:flex;justify-content:space-between;align-items:center;color:#8a9a8e;font-size:11px;margin:34px 0 10px}
    .progressTop strong {font-weight:600;color:var(--sage-dark)}
    .progressTrack {height:4px;border-radius:50px;background:#e5ebe2;overflow:hidden}
    .progressFill {height:100%;width:25%;background:var(--sage);border-radius:50px;transition:width .4s ease}
    .stage {width:100%;max-width:760px;margin:auto;flex:1;display:flex;flex-direction:column;justify-content:center;padding:38px 0 52px;min-height:520px}
    .stage.stageWide {max-width:1140px;justify-content:center}
    .stepTag {font-size:10px;letter-spacing:2.3px;text-transform:uppercase;color:#88a08b;font-weight:700;margin-bottom:20px}
    h1 {font:400 clamp(38px,5.25vw,65px)/1.12 'DM Serif Display',Georgia,serif;letter-spacing:-.9px;margin:0 0 17px;max-width:790px}
    h1 em {font-style:italic;color:#7c9980}
    .subtitle {font-size:14px;line-height:1.75;color:#829186;margin:0 0 32px;max-width:540px}
    .fieldGroup {margin-bottom:19px}
    .fieldLabel {font-size:10px;letter-spacing:1.35px;text-transform:uppercase;color:#849686;font-weight:700;display:block;margin-bottom:9px}
    .field {display:block;width:100%;border:0;border-bottom:1.5px solid #c5d2c4;padding:11px 1px 12px;background:transparent;color:var(--ink);font-size:16px;line-height:1.6;resize:vertical;border-radius:0;outline:0;transition:border .15s}
    .field:focus {border-color:var(--sage-dark);outline:0}
    .field::placeholder {color:#b1bfb2}
    .field.big {font-size:19px;min-height:110px}
    .field.small {font-size:14px}
    .fieldsGrid {display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
    .fieldsGrid .wide {grid-column:1/-1}
    .actions {display:flex;align-items:center;gap:18px;margin-top:29px;flex-wrap:wrap}
    .primary {background:var(--sage-dark);border:0;border-radius:8px;color:white;font-size:12px;font-weight:700;padding:16px 22px;display:inline-flex;align-items:center;justify-content:center;gap:23px;box-shadow:0 11px 25px #4b70551c;min-height:49px;transition:background .2s,transform .2s}
    .primary:hover:not(:disabled) {background:#2c4937;transform:translateY(-1px)}
    .secondary {border:0;background:none;color:#768c7b;font-size:12px;padding:13px 5px;font-weight:600}
    .secondary:hover {color:var(--ink)}
    .foot {border-top:1px solid var(--line);padding-top:17px;color:#9dad9c;font-size:10px;display:flex;justify-content:space-between;gap:15px}
    .right {border-left:1px solid var(--line);background:#f4f6f0;padding:36px 25px;display:flex;flex-direction:column;gap:21px}
    .asideLabel {font-size:10px;text-transform:uppercase;letter-spacing:1.8px;color:#94a398;font-weight:700}
    .clientCard {border:1px solid #e3ebe0;background:var(--white);border-radius:14px;padding:23px 20px;box-shadow:var(--shadow)}
    .cardEyebrow {font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#9aa69a;font-weight:700}
    .clientIcon {border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font:400 19px Georgia,serif;background:#e9f0e6;color:#64856a;margin:18px 0 12px}
    .clientName {font:400 23px/1.2 'DM Serif Display',Georgia,serif;overflow-wrap:anywhere;margin-bottom:8px}
    .clientHint {font-size:12px;color:#8b9c90;line-height:1.65}
    .cardRule {height:1px;background:#e9eee6;margin:17px 0}
    .gentle {font-size:12px;line-height:1.7;color:#7c917f}
    .asideNote {border-radius:11px;padding:19px 18px;background:#e9f0e7;border:1px solid #dde8db;font-size:12px;line-height:1.7;color:#718976}
    .asideNote strong {display:block;color:var(--sage-dark);font-size:12px;margin-bottom:7px}
    .asideFooter {margin-top:auto;color:#a0ada2;font-size:10px;line-height:1.7}
    .mobileClient {display:none}
    .prefill {font:400 20px/1.6 'DM Serif Display',Georgia,serif;color:#507258;margin-bottom:14px}
    .readback {background:#f0f4ed;border:1px solid #e2ebe0;border-radius:13px;padding:20px 22px;margin:7px 0 24px}
    .readbackTitle {font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#8ca08d;font-weight:700;margin-bottom:11px}
    .readback p {font-size:14px;line-height:1.75;color:#526d57;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
    .probeActions {display:flex;align-items:center;gap:14px;margin:15px 0 9px;flex-wrap:wrap}
    .probeButton {border:1px solid #d5e2d2;border-radius:8px;padding:12px 17px;background:#eaf1e7;color:#4b7054;font-size:12px;font-weight:700}
    .probeButton:hover {background:#dfeadd}
    .probeStatus {font-size:11px;line-height:1.5;color:#869a87}
    .probes {display:grid;gap:12px;margin-top:13px}
    .probe {background:#fffefa;border:1px solid #dfe8dc;border-radius:12px;padding:17px 18px}
    .probeHeader {display:flex;justify-content:space-between;align-items:center;gap:8px}
    .probeTag {font-size:9px;text-transform:uppercase;letter-spacing:1.2px;color:#86a089;font-weight:700}
    .remove {background:none;border:0;color:#8b9d90;font-size:11px;text-decoration:underline;text-underline-offset:3px}
    .probeQuestion {font-size:14px;font-weight:600;line-height:1.6;margin:9px 0 11px}
    .probeWhy {font-size:11px;color:#718475;margin:-1px 0 11px}
    .probeWhy summary {cursor:pointer;width:max-content;max-width:100%;text-decoration:underline;text-underline-offset:3px}
    .probeWhy p {margin:7px 0 0;line-height:1.55}
    .emptyProbes {font-size:12px;color:#6b856f;background:#eff4eb;border:1px solid #e1eadc;border-radius:11px;padding:17px;line-height:1.6}
    .probeInput {width:100%;border:0;border-bottom:1px solid #d8e4d8;outline:0;background:transparent;padding:10px 0;color:var(--ink);font-size:13px}
    .probeInput:focus {border-color:var(--sage)}
    .probeInput::placeholder {color:#b1bfb2}
    .resources {margin-top:18px;padding-top:17px;border-top:1px solid #e0e9dd}
    .resourcesTitle {font-size:11px;font-weight:700;color:#507258;margin:0 0 9px}
    .resourceLink {display:flex;gap:10px;align-items:flex-start;text-decoration:none;padding:10px 0;color:var(--sage-dark);border-radius:6px}
    .resourceLink:hover .resourceTitle {text-decoration:underline;text-underline-offset:3px}
    .resourceIcon {font-size:15px;line-height:1.5;color:#88a18c}
    .resourceCopy {display:grid;gap:3px;min-width:0}
    .resourceTitle {font-size:12px;font-weight:600;line-height:1.45}
    .resourceMeta {font-size:10px;line-height:1.5;color:#859786}
    .textLink {font-size:12px;color:#608366;background:none;border:0;padding:8px 0;text-decoration:underline;text-underline-offset:4px}

    .splitGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:19px;align-items:start;margin-top:12px}
    .workPanel{border:1px solid var(--line);background:#fffefa;border-radius:16px;padding:23px;min-width:0;box-shadow:0 14px 25px rgba(47,69,51,.025)}
    .actionPanel{border-color:#d4e0d0;background:#f4f7f0}
    .panelHeading{display:flex;align-items:center;gap:11px;margin-bottom:20px}
    .panelHeading h2{font:400 24px/1.2 'DM Serif Display',Georgia,serif;letter-spacing:-.35px;margin:0}
    .panelEyebrow{width:27px;height:27px;flex:none;border:1px solid #cddccc;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#719177}
    .probePanel .probeActions{margin:0 0 15px;align-items:flex-start;gap:8px}
    .probePanel .probeStatus{font-size:10px}
    .probePanel .probeButton{padding:10px 12px}
    .probePanel .probes{margin:0 0 7px}
    .probePanel .probe{padding:14px}
    .probePanel .probeQuestion{font-size:13px;margin:7px 0 11px}
    .holdCallout{display:flex;align-items:flex-start;gap:13px;background:#e1eadc;color:#36553d;border:1px solid #bed1b8;border-radius:11px;padding:16px 15px;font-size:13px;line-height:1.65;margin-bottom:20px}
    .holdCallout strong{font-weight:700}
    .holdIcon{flex:none;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;background:#c7d9c2;font-size:14px;color:#3f6045}
    .outcomeChoices{display:grid;gap:9px}
    .actionChoice{cursor:pointer;border:1px solid #dee7d9;border-radius:11px;background:#fffefa;display:flex;gap:10px;align-items:center;padding:14px 12px;min-height:59px;transition:border .2s,background .2s}
    .actionChoice:hover{border-color:#a3bba3}
    .actionChoice.selected{border-color:#8baa8d;background:#e6f0e3}
    .actionChoice input{accent-color:#52785d;width:17px;height:17px;flex:none;margin:0}
    .choiceNumber{font-size:10px;color:#8ba18c;font-weight:700}
    .choiceText{font-size:12px;line-height:1.55;font-weight:600}
    .outcomeDetails{border-top:1px solid #d8e3d6;margin-top:16px;padding-top:18px}
    .outcomeDetails .fieldGroup{margin-bottom:13px}
    .outcomeDetails .field{font-size:13px}
    .verifyRow{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #dfe9dc;cursor:pointer}
    .verifyRow input{margin:4px 0 0;width:16px;height:16px;accent-color:#51765a}
    .verifyRow input:disabled{opacity:.35}
    .verifyCopy{display:grid;gap:3px;min-width:0;font-size:12px}
    .verifyCopy strong{color:#435f49;font-size:12px}
    .verifyCopy span{color:#829285;overflow-wrap:anywhere}
    .outcomeDetails .textLink{padding:11px 0 14px;font-size:11px}
    .noteEditor {width:100%;min-height:340px;background:#fffefa;border:1px solid #d7e3d5;border-radius:13px;padding:20px;font-size:13px;line-height:1.85;color:#374b3b;resize:vertical;outline:0}
    .noteEditor:focus {border-color:var(--sage)}
    .micro {font-size:11px;color:#91a092;line-height:1.6;margin-top:10px}
    .notice {padding:12px 14px;background:#f5eee6;color:var(--alert);border-radius:9px;font-size:11px;line-height:1.5;margin-top:14px}
    .fade {animation:fade .3s ease both}
    @keyframes fade {from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .typeChoices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0 22px}
    .typeChoice{cursor:pointer;position:relative;display:flex;align-items:center;gap:10px;padding:15px 13px;background:#fffefa;border:1px solid var(--line);border-radius:11px;min-height:61px;color:#738676;font-weight:600;font-size:12px;line-height:1.4;transition:background .15s,border-color .15s}
    .typeChoice.selected{background:#edf2ea;border-color:#7e9c81;color:#334f3a}
    .typeChoice input{position:absolute;opacity:0;width:1px;height:1px}
    .typeChoice:focus-within{outline:3px solid #a6c1aa;outline-offset:2px}
    .typeMark{width:17px;height:17px;flex:none;border:1.5px solid #adc0af;border-radius:50%;display:grid;place-items:center;color:transparent;font-size:10px}
    .typeChoice.selected .typeMark{background:#56735d;color:white;border-color:#56735d}
    @media(max-width:550px){.typeChoices{grid-template-columns:1fr;gap:8px}.typeChoice{min-height:49px;padding:11px 12px}}
    @media(max-width:1130px){.shell{grid-template-columns:170px minmax(0,1fr) 230px}.left{padding:28px 13px}.right{padding:30px 16px}.main{padding:27px 35px 22px}.sideStep{font-size:11px;gap:7px}.brand{font-size:20px}}
    @media(max-width:900px){.shell{display:flex;flex-direction:column}.left{min-height:auto;padding:15px 22px;border-bottom:1px solid var(--line);border-right:0;gap:0}.sideSteps,.sideFooter{display:none}.right{display:none}.main{min-height:calc(100vh - 65px);padding:19px 27px 22px}.top {position:sticky;top:0;z-index:10;background:var(--paper);padding:5px 0 13px}.mobileClient {display:flex;align-items:center;gap:9px;border-radius:50px;padding:9px 12px;background:#e9f0e7;color:#587960;font-size:12px;font-weight:600;max-width:57%;overflow:hidden}.mobileClient .initial {border-radius:100%;width:24px;height:24px;flex:none;display:grid;place-items:center;background:#cfdfce;font-family:Georgia,serif}.mobileClient span:last-child {text-overflow:ellipsis;overflow:hidden;white-space:nowrap}.topTag {display:none}.stage{max-width:700px;min-height:480px}.progressTop{margin-top:17px}}
    @media(max-width:780px){.splitGrid{grid-template-columns:1fr}.stage.stageWide{max-width:700px}.workPanel{padding:20px}}
    @media(max-width:550px){.left{padding:13px 17px}.brand{font-size:20px}.main{padding:13px 20px 24px}.topBadge{padding:8px 10px;font-size:9px}.mobileClient{max-width:55%;font-size:11px;padding:6px 10px}.stage{min-height:400px;padding:40px 0}.fieldsGrid{grid-template-columns:1fr;gap:0}.fieldsGrid .wide{grid-column:auto}.fieldGroup{margin-bottom:16px}h1{font-size:clamp(37px,9vw,49px)}.subtitle{font-size:13px}.field.big{font-size:17px}.foot span:last-child{display:none}.foot{font-size:9px}.readback{padding:16px}.probe{padding:14px}.noteEditor{min-height:320px}.actions{margin-top:25px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  
    /* CallFlow v11 — civic blue / white, with a gentle mission-progress aesthetic */
    :root { --paper:#f4f8ff;--ink:#102a47;--muted:#6f8299;--sage:#006bb6;--sage-dark:#075393;--soft:#ebf4ff;--white:#ffffff;--line:#dae6f4;--alert:#92602e;--shadow:0 20px 55px rgba(10,61,110,.08);--blue:#0072c6;--deep:#073968;--sky:#4ab4ed;--electric:#188bde; }
    html{scroll-behavior:smooth}
    body{background:radial-gradient(ellipse at 72% -15%,#e0f0ff 0,transparent 39%),var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}
    ::selection{background:#c5e4ff}
    button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #67bfff;outline-offset:3px}
    .shell{max-width:none;grid-template-columns:222px minmax(0,1fr);min-height:100vh}
    .left{height:100vh;position:sticky;top:0;background:linear-gradient(165deg,#082d51 0%,#073968 56%,#064c83 100%);border-right:0;padding:32px 16px 22px;gap:54px;box-shadow:5px 0 32px rgba(8,45,81,.06);z-index:11}
    .brand{color:#fff;font:800 25px/1 'Manrope',sans-serif;letter-spacing:-1.55px;padding:0 11px}
    .mark{border:1px solid #87cafa;background:#eaf6ff;color:#075393;font:800 18px 'Manrope',sans-serif;width:36px;height:36px;box-shadow:0 5px 16px #001e3a33}
    .brandDot{color:#7dcaff}
    .sideSteps{gap:9px}
    .sideStep{color:#c2ddf4;font-size:12px;border:1px solid transparent;border-radius:13px;min-height:48px;padding:10px 12px;transition:background .22s ease,border-color .22s ease,transform .22s ease}
    .sideStep .num{border-color:#749abd55;background:#ffffff0d;color:#bcdcf4;font-weight:800;font-size:10px}
    .sideStep:hover:not(:disabled){transform:translateX(3px);background:#ffffff14;color:#fff}
    .sideStep.active{color:white;background:#ffffff1e;border-color:#ffffff35;box-shadow:0 12px 24px #001d3630}
    .sideStep.active .num{border-color:#97dbff;background:#ffffff;color:#086da9}
    .sideStep.done{color:#e0f4ff}
    .sideStep.done .num{border-color:#5bc5ff;background:#3b9ed844;color:#e9f9ff}
    .sideFooter{color:#98bad7;border-top-color:#ffffff29;padding:19px 12px}
    .main{min-height:100vh;padding:23px clamp(25px,4.4vw,78px) 22px}
    .top{position:sticky;top:14px;z-index:15;justify-content:flex-start;align-items:center;gap:15px;padding:13px 17px;background:#fff;border:1px solid #d9e6f6;border-radius:18px;box-shadow:0 13px 45px rgba(10,54,99,.065);min-height:78px;backdrop-filter:blur(14px)}
    .topBadge{border:1px solid #cae6fa;background:#f0f9ff;color:#07699f;border-radius:50px;padding:11px 14px;letter-spacing:.75px;font-size:10px;white-space:nowrap}
    .greenDot{width:8px;height:8px;background:#00a7c7;box-shadow:0 0 0 4px #00a7c71c;animation:statusPulse 2.7s ease-in-out infinite}
    .topBadge.complete{background:#e9f6ff;border-color:#afd5f1;color:#095d93}
    .topBadge.complete .greenDot{animation:none;background:#168fc2}
    .topClient{display:flex;align-items:center;gap:11px;border-left:1px solid #dfe9f6;padding-left:19px;min-width:0;flex:1}
    .topClientAvatar{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:13px;background:linear-gradient(145deg,#cceaff,#ecf7ff);color:#075393;font:800 19px 'Manrope',sans-serif;border:1px solid #bbdef7}
    .topClientCopy{display:grid;gap:2px;min-width:0}
    .topClientLabel{font-size:10px;letter-spacing:1.05px;font-weight:800;color:#7388a3;text-transform:uppercase}
    .topClientName{font:800 16px/1.3 'Manrope',sans-serif;color:#102e51;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
    .topAssist{display:flex;align-items:center;gap:7px;color:#487392;font-size:10px;letter-spacing:.65px;text-transform:uppercase;font-weight:800;white-space:nowrap;border-radius:99px;background:#edf6ff;padding:10px 13px}
    .assistantSpark{display:inline-grid;place-items:center;width:17px;height:17px;background:#cfe9fb;border-radius:6px;color:#0479bb;font-size:14px}
    .progressTop{font-size:11px;margin:27px 0 12px;color:#68849d;font-weight:700}
    .progressTop strong{color:#075393}
    .progressTrack{height:7px;background:#e1edfa;box-shadow:inset 0 0 0 1px #d5e4f3}
    .progressFill{background:linear-gradient(90deg,#0074be,#33b5eb);transition:width .65s cubic-bezier(.22,1,.36,1);position:relative}
    .progressFill:after{content:'';position:absolute;right:0;top:-3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #0877c8;box-shadow:0 0 0 4px #0877c81c}
    .stage{max-width:810px;min-height:580px;padding:48px 0 68px}
    .stage.stageWide{max-width:1200px}
    .stepTag{color:#0077c6;font-size:11px;letter-spacing:1.9px;margin-bottom:17px}
    h1{font:800 clamp(35px,4.25vw,56px)/1.15 'Manrope',sans-serif;letter-spacing:-1.85px;margin-bottom:19px}
    h1 em{color:#0076c3;font-style:normal}
    .subtitle{color:#667e99}
    .fieldLabel{color:#5a7794;font-size:11px;letter-spacing:1.05px}
    .field{background:#fff;border:1px solid #d9e6f5;border-radius:12px;padding:14px 16px;color:#0a2947;font-size:15px;box-shadow:0 6px 22px rgba(10,51,96,.035);transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease}
    .field:focus{border-color:#128bde;box-shadow:0 0 0 4px #128bde17;outline:0;transform:translateY(-1px)}
    .field::placeholder{color:#a6b8cb}
    .field.big{font-size:18px;line-height:1.65}
    .prefill{font:700 18px/1.5 'Manrope',sans-serif;color:#0b6bac}
    .primary{background:linear-gradient(120deg,#006bb6,#0789d7);border-radius:11px;font-size:13px;box-shadow:0 13px 28px #0072c52a;padding:16px 21px;transition:transform .23s cubic-bezier(.2,.8,.2,1),box-shadow .23s ease,filter .23s ease}
    .primary:hover:not(:disabled){background:linear-gradient(120deg,#005a9f,#0876bd);transform:translateY(-2px);box-shadow:0 17px 31px #0072c53b}
    .primary:active:not(:disabled){transform:translateY(0) scale(.98)}
    .secondary{color:#236c9c;transition:color .2s ease,transform .2s ease}
    .secondary:hover{color:#06477e;transform:translateX(-2px)}
    .foot{border-top-color:#d8e5f5;color:#8199af}
    .readback{background:#eaf4ff;border:1px solid #d2e6f7;border-radius:15px}
    .readbackTitle{color:#176a9e}
    .readback p{color:#214e77}
    .typeChoice,.actionChoice{background:#fff;border-color:#d9e6f5;color:#496c89;box-shadow:0 5px 18px rgba(10,54,99,.03);transition:transform .22s ease,border-color .22s ease,background .22s ease,box-shadow .22s ease}
    .typeChoice:hover,.actionChoice:hover{border-color:#77bce8;transform:translateY(-2px);box-shadow:0 11px 26px #0b70b512}
    .typeChoice.selected,.actionChoice.selected{background:#e9f5ff;border-color:#0587d5;color:#075393;box-shadow:0 0 0 3px #0684cf10}
    .typeChoice.selected .typeMark{background:#057fc7;border-color:#057fc7}
    .actionChoice input,.verifyRow input{accent-color:#0072c6}
    .workPanel{border:1px solid #dbe8f7;background:#fff;border-radius:20px;padding:24px;box-shadow:0 16px 42px rgba(10,54,99,.055)}
    .actionPanel{border-color:#cfe1f5;background:linear-gradient(180deg,#f1f8ff 0%,#eaf4ff 100%)}
    .panelHeading h2{font:800 22px/1.3 'Manrope',sans-serif;letter-spacing:-.6px}
    .panelEyebrow{border-color:#c6e1f7;background:#e8f5ff;color:#0575b9;font-weight:800}
    .holdCallout{background:#dcefff;border-color:#b5d8f4;color:#114e83}
    .holdIcon{background:#c0e3ff;color:#096da9}
    .outcomeDetails{border-top-color:#d3e3f2}
    .verifyRow{border-bottom-color:#d4e5f5}
    .verifyCopy strong{color:#1e537e}.verifyCopy span{color:#6485a0}
    .probeButton{background:#eff8ff;color:#086bab;border:1px solid #c9e2f7;border-radius:10px;transition:transform .2s ease,background .2s ease}
    .probeButton:hover{background:#dff1ff;transform:translateY(-1px)}
    .probeStatus{color:#6b86a0}
    .probes{gap:13px}
    .probe{background:#fff;border:1px solid #deebf8;border-radius:14px;padding:16px;box-shadow:0 5px 16px #104f8c08;transition:transform .25s ease,border-color .22s ease,background .22s ease,box-shadow .22s ease;animation:cardRise .35s cubic-bezier(.22,1,.36,1) both}
    .probe:hover{border-color:#b9d7ed}
    .probe.answered{background:linear-gradient(130deg,#f6fbff,#ebf7ff);border-color:#61b5ee;box-shadow:0 0 0 2px #40a4e915,0 10px 28px rgba(10,98,165,.085)}
    .probe.answered .probeQuestion{font-weight:800;color:#075896}
    .probeTag{color:#267eae}
    .probeQuestion{color:#193c61;font-size:13px;line-height:1.55}
    .probeWhy{color:#62829d}
    .probeAnswerState{font-size:10px;font-weight:800;letter-spacing:.35px;color:#7b93a9;background:#f0f5fa;border:1px solid #deebf5;padding:5px 8px;border-radius:999px;white-space:nowrap;transition:color .22s,background .22s,border-color .22s}
    .probe.answered .probeAnswerState{background:#d8f0ff;color:#086ba5;border-color:#9dd5f4}
    .probeInput{border:1px solid #dce8f5;background:#f8fbff;border-radius:9px;padding:12px 13px;font-size:13px;transition:box-shadow .2s,border-color .2s,background .2s}
    .probeInput:focus{border-color:#1385cf;background:#fff;box-shadow:0 0 0 3px #1b92dd16;outline:0}
    .probe.answered .probeInput{font-weight:700;background:#fff;border-color:#b2d9f3}
    .probeInput::placeholder{color:#9fb2c5}
    .emptyProbes{background:#eff7ff;border-color:#cfe3f6;color:#3b759a}
    .resources{border-top-color:#dce9f6}
    .resourcesTitle{color:#0b5b96}
    .resourceLink{padding:11px 9px;margin:0 -9px;transition:background .2s,transform .2s}
    .resourceLink:hover{background:#f1f8ff;transform:translateX(3px)}
    .resourceIcon{color:#087ebd}.resourceTitle{color:#125b92}.resourceMeta{color:#7793aa}
    .textLink{color:#0872b6}
    .noteEditor{background:#fff;border-color:#cfe1f3;color:#173b5e;border-radius:14px;box-shadow:0 9px 25px #114e8508}
    .noteEditor:focus{border-color:#0879bd;box-shadow:0 0 0 4px #1385cf12}
    .micro{color:#748ea4}
    .notice{background:#fff7e9;color:#805b2d}
    .fade{animation:stageEnter .45s cubic-bezier(.22,1,.36,1) both}
    @keyframes stageEnter{from{opacity:0;transform:translateY(13px) scale(.996)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes cardRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes statusPulse{0%,100%{box-shadow:0 0 0 3px #00a7c715}50%{box-shadow:0 0 0 7px #00a7c724}}
    .topTag,.mobileClient,.right{display:none!important}
    @media (max-width:1130px){.shell{grid-template-columns:196px minmax(0,1fr)}.left{padding:25px 11px}.main{padding:21px 28px}.brand{font-size:22px}.sideStep{gap:9px}}
    @media (max-width:900px){.shell{display:flex;flex-direction:column}.left{height:auto;position:relative;min-height:auto;padding:14px 19px;gap:0;background:#073968;box-shadow:none;border:0}.brand{padding:0;font-size:22px}.sideSteps,.sideFooter{display:none}.main{min-height:calc(100vh - 65px);padding:16px 20px 24px}.top{position:sticky;top:9px;padding:12px 13px;min-height:70px}.progressTop{margin-top:20px}.stage{min-height:460px;padding:35px 0 60px}}
    @media (max-width:780px){.splitGrid{grid-template-columns:1fr;gap:16px}.stage.stageWide{max-width:750px}.workPanel{padding:21px}.topAssist{display:none}}
    @media (max-width:550px){.main{padding:12px 13px 22px}.top{padding:11px;gap:8px;min-height:68px;border-radius:13px}.topBadge{font-size:9px;padding:8px 9px;letter-spacing:.15px}.topClient{padding-left:10px;gap:8px}.topClientAvatar{width:33px;height:33px;border-radius:10px;font-size:16px}.topClientLabel{font-size:9px}.topClientName{font-size:13px}.stage{min-height:390px;padding:36px 0}.typeChoices{grid-template-columns:1fr}.field{font-size:14px}.field.big{font-size:16px}h1{font-size:clamp(32px,9vw,45px);letter-spacing:-1.25px}.panelHeading h2{font-size:20px}}
    @media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

  </style>
</head>
<body>
<div class="shell">
  <aside class="left">
    <div class="brand" aria-label="CallFlow"><span class="mark">c</span>callflow<span class="brandDot">.</span></div>
    <nav class="sideSteps" id="sideSteps" aria-label="Call progress"></nav>
    <div class="sideFooter">✳<br>Learn the flow.<br>Build the habit.</div>
  </aside>
  <main class="main">
    <div class="top" aria-label="Current call" role="status">
      <div class="topBadge" id="callStateBadge"><span class="greenDot" aria-hidden="true"></span> <span id="callStateLabel">Call in progress</span></div>
      <div class="topClient" aria-live="polite">
        <span class="topClientAvatar" id="topClientIcon" aria-hidden="true">✧</span>
        <span class="topClientCopy"><span class="topClientLabel">Speaking with</span><strong class="topClientName" id="topClientName">Your client</strong></span>
      </div>
      <span class="topAssist"><span class="assistantSpark" aria-hidden="true">✦</span> CallFlow assistant</span>
    </div>
    <div class="progressTop"><span id="progressLabel">01 / 04 · Basics</span><strong id="progressPercent">25%</strong></div>
    <div class="progressTrack" role="progressbar" aria-label="CallFlow progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25" id="progressTrack"><div class="progressFill" id="progressFill"></div></div>
    <section class="stage fade" id="stage" aria-live="polite"></section>
    <footer class="foot"><span>✳ &nbsp; Clarity, one call at a time.</span><span>Practice with fictional information only.</span></footer>
  </main>

</div>
<script src="./guides-data.js"></script>
<script src="./probing-engine.js"></script>
<script>
(() => {
  'use strict';
  const stages = ['Basic information', 'Reason for calling', 'Paraphrase', 'Probing & action', 'Call notes'];
  const blank = () => ({
    fullName: '', phone: '', email: '', address: '', reason: '', extra: '', callType: 'unsure', probes: [], probeHistory: [], activeGuideId: '',
    outcome: '', resolvedNotes: '', followupNotes: '', escalationTeam: '', escalationNotes: '',
    verified: { fullName: false, phone: false, email: false }
  });
  let data = blank(), step = 0, maxStep = 0, source = 'guided', loading = false, editedNotes = '', callToken = 0;
  let callStartedAt = null, callEndedAt = null;
  const timestamp = date => date ? new Intl.DateTimeFormat('en-US', {year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit',timeZoneName:'short'}).format(date) : 'Not recorded';
  const $ = s => document.querySelector(s);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const val = v => String(v ?? '').trim() || 'Not provided';
  const first = () => data.fullName.trim().split(/\s+/)[0] || 'The client';
  const lead = () => { const prefix = first() + ' is calling about'; const reason = data.reason.trim(); return reason.toLowerCase().startsWith(prefix.toLowerCase()) ? reason : prefix + (reason ? ' ' + reason : '…'); };
  const outcomes = {resolved:'Issue was resolved', followup:'More time needed to troubleshoot', escalated:'Escalated to another team'};
  function setStep(n) { if(n===4 && !outcomeComplete()) return; step = Math.max(0, Math.min(4, n)); maxStep = Math.max(maxStep, step); render(); window.scrollTo?.({top:0,behavior:'instant'}); }
  function nav() {
    $('#sideSteps').innerHTML = stages.map((name,i) => `<button class="sideStep ${i===step?'active':''} ${i<step?'done':''}" ${i>maxStep?'disabled':''} data-go="${i}" ${i===step?'aria-current="step"':''}><span class="num">${i<step?'✓':String(i+1).padStart(2,'0')}</span>${name}</button>`).join('');
    document.querySelectorAll('[data-go]').forEach(btn => btn.addEventListener('click', () => setStep(+btn.dataset.go)));
    const amount = step===4 ? 100 : step*25;
    $('#progressFill').style.width = amount+'%';
    $('#progressPercent').textContent = amount+'%';
    $('#progressLabel').textContent = step===4 ? 'Complete · Call notes' : `${String(step+1).padStart(2,'0')} / 04 · ${stages[step]}`;
    $('#progressTrack').setAttribute('aria-valuenow', amount);
    const name = data.fullName.trim() || 'Your client';
    $('#callStateLabel').textContent = step===4 ? 'Call complete' : 'Call in progress';
    $('#callStateBadge').classList.toggle('complete',step===4);
    $('#topClientName').textContent = name;
    $('#topClientIcon').textContent = name==='Your client' ? '✧' : name.charAt(0).toUpperCase();
  }
  function head(tag,title) {return `<div class="stepTag">${tag}</div><h1>${title}</h1>`;}
  function field(key,label,placeholder,opts={}) {
    const {type='text',multi=false,required=false,wide=false}=opts;
    return `<div class="fieldGroup ${wide?'wide':''}"><label class="fieldLabel" for="${key}">${label}${required?' *':''}</label>${multi
      ? `<textarea id="${key}" class="field ${key==='reason'?'big':'small'}" rows="${key==='reason'?3:2}" placeholder="${esc(placeholder)}" ${required?'required':''}>${esc(data[key])}</textarea>`
      : `<input id="${key}" class="field" type="${type}" value="${esc(data[key])}" placeholder="${esc(placeholder)}" autocomplete="off" ${required?'required':''}>`}</div>`;
  }
  // The first-name lead-in is prewritten inside the editable call-reason field.
  function reasonField() {
    return `<div class="fieldGroup"><label class="fieldLabel" for="reason">Reason for calling *</label><textarea id="reason" class="field big" rows="3" aria-label="Reason for calling">${esc(lead())}</textarea></div>`;
  }
  function outcomeComplete() {return !!data.outcome && (data.outcome !== 'resolved' || !!data.resolvedNotes.trim());}
  function canContinue() {return step===0 ? !!data.fullName.trim() : step===1 ? !!data.reason.trim() : step===3 ? outcomeComplete() : true;}
  function controls(nextLabel='Continue') {return `<div class="actions"><button class="primary" id="next" ${canContinue()?'':'disabled'}>${nextLabel} <span aria-hidden="true">↗</span></button>${step>0?'<button class="secondary" id="back">← Back</button>':''}</div>`;}
  function probeCard(p,i) {
    const answered=!!String(p.a||'').trim();
    return `<div class="probe ${answered?'answered':''}"><div class="probeHeader"><span class="probeTag">${esc(p.gap||'Follow-up')}</span><span class="probeAnswerState" aria-live="polite">${answered?'✓ Answered':'Awaiting answer'}</span></div>${p.custom
      ? `<input class="probeInput" data-question="${i}" value="${esc(p.q)}" placeholder="Type your question…" aria-label="Custom probing question">`
      : `<div class="probeQuestion">${esc(p.q)}</div>${p.why?`<details class="probeWhy"><summary>Why ask?</summary><p>${esc(p.why)}</p></details>`:''}`}
      <label class="fieldLabel" for="answer${i}">Client's answer</label><input class="probeInput" id="answer${i}" data-answer="${i}" value="${esc(p.a||'')}" placeholder="Add their answer…"></div>`;
  }
  function resourcePanel(analysis) {
    const rows=(analysis.resources||[]).map(r=>`<a class="resourceLink" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${esc(r.title)} in a new tab"><span class="resourceIcon" aria-hidden="true">↗</span><span class="resourceCopy"><span class="resourceTitle">${esc(r.title)}</span><span class="resourceMeta">${esc(r.origin)} · ${esc(r.detail)}</span></span></a>`).join('');
    const info=analysis.referenceCoverage==='directory'?'No matching guide. Verify against the 311 directory.':analysis.guideId?`Approved portfolio guide ${analysis.guideId} · ${analysis.guideVolume2025.toLocaleString()} 2025 contacts/requests · Check current service details.`:'Questions are based on example public service guidance. Verify current information.';
    return `<div class="resources">${analysis.routingNote?`<div class="notice" role="status">${esc(analysis.routingNote)}</div>`:""}<div class="resourcesTitle">Relevant service information</div>${rows}<p class="probeStatus">${esc(info)}</p></div>`;
  }
  function callTypeChoices() {
    return `<div class="fieldGroup"><div class="fieldLabel">Type of call</div><div class="typeChoices" role="radiogroup" aria-label="Type of call">
    ${[['general_inquiry','General inquiry'],['service_request','Service request'],['unsure','Not sure yet']].map(([id,label])=>`<label class="typeChoice ${data.callType===id?'selected':''}"><input type="radio" name="callType" value="${id}" ${data.callType===id?'checked':''}><span class="typeMark" aria-hidden="true">✓</span>${label}</label>`).join('')}
    </div></div>`;
  }
  function choice(id,number,label) {
    return `<label class="actionChoice ${data.outcome===id?'selected':''}"><input type="radio" name="outcome" value="${id}" ${data.outcome===id?'checked':''}><span class="choiceNumber">${number}</span><span class="choiceText">${label}</span></label>`;
  }
  function actionFields() {
    if (data.outcome==='resolved') return `<div class="outcomeDetails">${field('resolvedNotes','Resolution comments','What resolved the issue?',{multi:true,required:true})}</div>`;
    if (data.outcome==='followup') {
      const contacts=[['fullName','Full name'],['email','Email address'],['phone','Phone number']];
      return `<div class="outcomeDetails"><div class="fieldLabel">Verify contact details</div>
        ${contacts.map(([key,label])=>`<label class="verifyRow"><input type="checkbox" data-verify="${key}" ${data.verified[key]?'checked':''} ${!data[key].trim()?'disabled':''}><span class="verifyCopy"><strong>${label}</strong><span>${esc(data[key].trim()||'Not provided — update basic information')}</span></span></label>`).join('')}
        <button type="button" class="textLink" id="editContact">Edit contact details ↗</button>
        ${field('followupNotes','Troubleshooting / follow-up notes','What still needs to be done?',{multi:true})}</div>`;
    }
    if (data.outcome==='escalated') return `<div class="outcomeDetails">${field('escalationTeam','Team / department','e.g. Technical support')}${field('escalationNotes','Escalation notes','Why is escalation needed? What was communicated?',{multi:true})}</div>`;
    return '';
  }
  function render() {
    nav();
    const stage=$('#stage');stage.classList.remove('fade');void stage.offsetWidth;stage.classList.add('fade');
    stage.classList.toggle('stageWide',step===3);
    let html='';
    const guidance=step===3?analyzeCurrentCall():null;
    switch(step) {
      case 0:
        html=head('01 · Basic information','Basic information')+`<div class="fieldsGrid">${field('fullName','Full name','e.g. Alex Morgan',{required:true,wide:true})}${field('phone','Phone number','(416) 555-0148',{type:'tel'})}${field('email','Email address','alex@example.com',{type:'email'})}${field('address','Address','Street address, city',{wide:true})}</div>`+controls();
        break;
      case 1:
        html=head('02 · Understand','What can I help you with <em>today?</em>')+reasonField()+controls();
        break;
      case 2:
        html=head('03 · Paraphrase','Thank you for explaining. <em>What I understand is…</em>')+`<div class="readback"><div class="readbackTitle">Reason for calling</div><p>${esc(lead())}</p></div>`+field('extra','Additional details','Add anything missed earlier…',{multi:true})+callTypeChoices()+controls();
        break;
      case 3:
        html='<div class="stepTag">04 · Probing & action</div>'+`<div class="splitGrid">
          <section class="workPanel probePanel" aria-label="Suggested probing questions"><div class="panelHeading"><span class="panelEyebrow">01</span><h2>Probing questions</h2></div>
            <div class="probeActions"><button class="probeButton" id="suggest">↻ Refresh suggestions</button><span class="probeStatus" id="probeStatus">${source==='ai'?'AI ranked':guidance.guideId?'Reviewed guide':'General practice'} · ${esc(guidance.categoryLabel)}</span></div>
            ${guidance.safetyNote?`<div class="notice" role="status">${esc(guidance.safetyNote)}</div>`:''}
            <div class="probes" id="probes">${data.probes.length?data.probes.map(probeCard).join(''):'<div class="emptyProbes">No further questions suggested based on the details captured.</div>'}</div>${data.probes.length<2?'<button class="textLink" id="add">+ Add a question</button>':''}<div id="serviceResources">${resourcePanel(guidance)}</div>
          </section>
          <section class="workPanel actionPanel" aria-label="Call actions"><div class="panelHeading"><span class="panelEyebrow">02</span><h2>Action</h2></div>
            <div class="holdCallout"><span class="holdIcon" aria-hidden="true">Ⅱ</span><div>Place <strong>${esc(first())}</strong> on a brief hold to troubleshoot if needed.</div></div>
            <div class="outcomeChoices">${choice('resolved','01','Issue was resolved')}${choice('followup','02','I need more time to troubleshoot')}${choice('escalated','03','Issue needs to be escalated to another team')}</div>
            ${actionFields()}
          </section>
        </div>`+controls('Review notes');
        break;
      case 4:
        html=head('Call complete','Call notes')+`<label class="fieldLabel" for="notes">CRM documentation</label><textarea class="noteEditor" id="notes" spellcheck="true">${esc(editedNotes)}</textarea><div class="micro">Review and edit before copying. No CRM connection.</div><div class="actions"><button class="primary" id="copy">Copy notes <span aria-hidden="true">⧉</span></button><button class="secondary" id="back">← Back</button><button class="secondary" id="restart">Start new call ↻</button></div>`;
        break;
    }
    stage.innerHTML=html;
    bind();
  }
  function noteText() {
    // Record answered questions and their corresponding answers, including historical answers when guidance changes.
    const answers=allProbeRecords().filter(p=>String(p.a||'').trim()).map(p=>`Question: ${String(p.q||'Follow-up question').trim()}\nAnswer: ${String(p.a).trim()}`);
    const sections=[
      'CALL NOTES',
      `CALL TIMESTAMPS\nStarted: ${timestamp(callStartedAt)}\nCompleted: ${timestamp(callEndedAt)}`,
      `CONTACT\nFull name: ${val(data.fullName)}\nPhone: ${val(data.phone)}\nEmail: ${val(data.email)}\nAddress: ${val(data.address)}`,
      `REASON FOR CALL\n${lead()}`
    ];
    if (data.callType!=='unsure') sections.push(`CALL TYPE\n${data.callType==='service_request'?'Service request':'General inquiry'}`);
    if (data.extra.trim()) sections.push(`ADDITIONAL DETAILS\n${data.extra.trim()}`);
    if (answers.length) sections.push(`PROBING QUESTIONS & ANSWERS\n${answers.join('\n\n')}`);
    if (data.outcome) {
      const action=[`Status: ${outcomes[data.outcome]}`];
      if (data.outcome==='resolved' && data.resolvedNotes.trim()) action.push(`Resolution comments: ${data.resolvedNotes.trim()}`);
      if (data.outcome==='followup') {
        const verified=[['fullName','name'],['email','email'],['phone','phone number']].filter(([k])=>data.verified[k]).map(([,label])=>label);
        if (verified.length) action.push(`Contact details verified: ${verified.join(', ')}`);
        if (data.followupNotes.trim()) action.push(`Follow-up notes: ${data.followupNotes.trim()}`);
      }
      if (data.outcome==='escalated') {
        if (data.escalationTeam.trim()) action.push(`Escalation team: ${data.escalationTeam.trim()}`);
        if (data.escalationNotes.trim()) action.push(`Escalation notes: ${data.escalationNotes.trim()}`);
      }
      sections.push(`ACTION / OUTCOME\n${action.join('\n')}`);
    }
    return sections.join('\n\n');
  }
  function bind() {
    const next=$('#next');
    for (const k of ['fullName','phone','email','address','reason','extra','resolvedNotes','followupNotes','escalationTeam','escalationNotes']) {
      const el=$('#'+k);if(!el)continue;
      if (k==='reason') {
        el.addEventListener('focus',()=>{
          if (!data.reason.trim() && el.value===first()+' is calling about…') {
            el.value=first()+' is calling about ';
            el.setSelectionRange(el.value.length,el.value.length);
          }
        });
        el.addEventListener('blur',()=>{
          if (!data.reason.trim()) el.value=first()+' is calling about…';
        });
      }
      el.addEventListener('input',()=>{
        if (!callStartedAt && el.value.trim()) callStartedAt = new Date();
        if (k==='reason') {
          const prewritten=first()+' is calling about';
          data.reason=el.value.startsWith(prewritten)
            ? el.value.slice(prewritten.length).replace(/^[\s…]+/,'')
            : el.value;
        } else data[k]=el.value;
        if (data.verified[k]!==undefined) data.verified[k]=false;
        if (k==='fullName') nav();
        if (next) next.disabled=!canContinue();
      });
      el.addEventListener('keydown', e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();advance();}});
    }
    next?.addEventListener('click',advance);
    $('#back')?.addEventListener('click',()=>setStep(step-1));
    $('#suggest')?.addEventListener('click',suggest);
    $('#add')?.addEventListener('click',()=>{if(data.probes.length<2)data.probes.push({q:'',a:'',gap:'Your question',custom:true});render();});
    $('#probes')?.addEventListener('input',e=>{
      if(e.target.matches('[data-answer]')){
        const p=data.probes[Number(e.target.dataset.answer)];
        if(p){
          p.a=e.target.value;
          const card=e.target.closest('.probe');
          const answered=!!p.a.trim();
          if(card){
            card.classList.toggle('answered',answered);
            const status=card.querySelector('.probeAnswerState');
            if(status)status.textContent=answered?'✓ Answered':'Awaiting answer';
          }
          updateKnowledgePanel();
        }
      }
      if(e.target.matches('[data-question]')){const p=data.probes[Number(e.target.dataset.question)];if(p)p.q=e.target.value;}
    });
    $('#probes')?.addEventListener('focusout',e=>{
      if(e.target.matches('[data-answer]')){
        // Preserve the input while the agent types; refresh questions on blur.
        if(syncProbes())render();
      }
    });
    document.querySelectorAll('input[name="callType"]').forEach(el=>el.addEventListener('change',()=>{data.callType=el.value;render();}));
    document.querySelectorAll('input[name="outcome"]').forEach(el=>el.addEventListener('change',()=>{data.outcome=el.value;render();}));
    document.querySelectorAll('[data-verify]').forEach(el=>el.addEventListener('change',()=>{data.verified[el.dataset.verify]=el.checked;}));
    $('#editContact')?.addEventListener('click',()=>setStep(0));
    $('#notes')?.addEventListener('input',e=>{editedNotes=e.target.value;});
    $('#copy')?.addEventListener('click',copyNotes);
    $('#restart')?.addEventListener('click',()=>{callToken++;data=blank();step=0;maxStep=0;editedNotes='';callStartedAt=null;callEndedAt=null;source='guided';loading=false;render();window.scrollTo?.({top:0,behavior:'instant'});});
  }
  // The locally stored, reviewed guide library is checked on entering Step 4,
  // when answers change, and when the agent manually refreshes suggestions.
  function allProbeRecords() {return [...data.probeHistory,...data.probes];}
  function analyzeCurrentCall() {
    return window.CallFlowProbing.analyze({issue:data.reason,details:data.extra,callType:data.callType,probes:allProbeRecords()});
  }
  function syncProbes(force=false) {
    let analysis=analyzeCurrentCall();
    const guideId=analysis.guideId||analysis.category;
    const switched=!!data.activeGuideId&&guideId!==data.activeGuideId;
    if(switched) {
      // Carry earlier answers into the final notes without displaying an
      // unrelated previous question under the newly matched service.
      data.probeHistory.push(...data.probes.filter(p=>String(p.a||'').trim()));
      data.probes=[];
      analysis=analyzeCurrentCall();
    }else if(force){
      data.probes=data.probes.filter(p=>String(p.a||'').trim()||p.custom).slice(0,2);
    }
    data.activeGuideId=guideId;
    const proposed=analysis.questions.map(p=>({id:p.id,gap:p.gap,q:p.question,why:p.why,a:''}));
    for(const p of proposed){
      if(data.probes.length>=2)break;
      if(data.probes.some(e=>e.id===p.id||String(e.q||'').toLowerCase()===p.q.toLowerCase()))continue;
      data.probes.push(p);
    }
    source='guided';
    return switched;
  }
  function updateKnowledgePanel() {
    if(step!==3)return;
    const a=analyzeCurrentCall();
    const panel=$('#serviceResources');if(panel)panel.innerHTML=resourcePanel(a);
    const status=$('#probeStatus');
    if(status)status.textContent=(a.guideId?'Reviewed guide':'General practice')+' · '+a.categoryLabel;
  }
  function advance() {
    if(!canContinue()) return;
    if(step===2)syncProbes();
    if(step===3) {callStartedAt ??= new Date();callEndedAt = new Date();editedNotes=noteText();}
    setStep(step+1);
  }
  // Offline-only lookup. No external API or resident information is transmitted.
  function suggest() {syncProbes(true);render();}
  async function copyNotes() {
    const input=$('#notes');if(!input)return;
    try {
      if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(input.value);
      else {input.focus();input.select();if(!document.execCommand('copy'))throw new Error('Not supported');}
      $('#copy').textContent='✓ Copied';
    }catch{input.focus();input.select();alert('Select and copy the highlighted notes.');}
  }
  render();
})();
</script>
</body>
</html>
